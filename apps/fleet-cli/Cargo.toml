[package]
name = "fleet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "fleet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
fleet-core-auth.workspace = true
fleet-core-config.workspace = true
fleet-core-connection.workspace = true
fleet-core-protocol.workspace = true
dirs.workspace = true
# Linux uses the 0600 fallback file. The Secret Service backend pulls in
# libdbus, which prevents static musl builds.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
libc = "0.2"
reqwest.workspace = true
rpassword = "7"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tempfile.workspace = true
