name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows (compile + file install)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compiles the Task Scheduler backend for both roles and checks the
      # Windows-specific install path (archive names use .exe).
      - run: cargo check -p fleet-admin -p fleet-daemon -p fleet-cli
      - run: cargo test -p fleet-cli install::tests
      - run: cargo test -p fleet-cli process::windows_task::tests
      - name: Build Windows binaries
        run: cargo build -p fleet-admin -p fleet-daemon -p fleet-cli
      - name: File-only install smoke
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "fleet-dist"
          $prefix = Join-Path $env:RUNNER_TEMP "fleet-prefix"
          New-Item -ItemType Directory -Force -Path "$dist\bin", "$dist\web" | Out-Null
          Copy-Item target\debug\fleet.exe, target\debug\fleet-admin.exe, target\debug\fleet-daemon.exe "$dist\bin\"
          Set-Content -Path "$dist\web\index.html" -Value "<html>ok</html>"
          & target\debug\fleet.exe install --from-dir $dist --prefix $prefix --no-service
          if (-not (Test-Path "$prefix\share\fleet\install.json")) {
            throw "install manifest missing"
          }
          Get-Content "$prefix\share\fleet\install.json"

  linux-musl:
    name: Linux musl (build check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build static binaries
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: -C target-feature=+crt-static -C relocation-model=static
        run: cargo build --release --target x86_64-unknown-linux-musl -p fleet-admin -p fleet-daemon -p fleet-cli
      - name: Verify static linking
        run: |
          file target/x86_64-unknown-linux-musl/release/fleet | tee /tmp/fleet-file.txt
          grep -Eq 'statically linked|static-pie linked' /tmp/fleet-file.txt
          if readelf -d target/x86_64-unknown-linux-musl/release/fleet | grep -q NEEDED; then
            echo "binary has dynamic library dependencies" >&2
            exit 1
          fi
      - run: target/x86_64-unknown-linux-musl/release/fleet --version

  web:
    name: Web (install, typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-fleet/web exec tsc -p tsconfig.app.json --noEmit
      - run: pnpm --filter @agent-fleet/web lint
      - run: pnpm --filter @agent-fleet/web build

  docs:
    name: Docs (check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Static project commands only; no untrusted event data is interpolated.
      - run: pnpm --filter docs exec nimbus-docs check
      - run: pnpm --filter docs build

  stress:
    name: Multi-machine stress (3 daemons, 6 workspaces)
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fleet-admin -p fleet-daemon -p fleet-cli
      - run: cargo test -p fleet-e2e-tests --test multi_machine -- --ignored --test-threads=1

  ui-e2e:
    name: Browser E2E (Playwright + fleet-admin + fleet-daemon)
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @agent-fleet/web exec playwright install --with-deps chromium
      - run: cargo build -p fleet-admin -p fleet-daemon -p fleet-cli
      - run: cargo test -p fleet-e2e-tests --test ui -- --ignored
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  e2e:
    name: End-to-end (fleet-admin + fleet-daemon + fleet CLI)
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p fleet-admin -p fleet-daemon -p fleet-cli
      - name: Stage the upgrade smoke archives
        run: |
          version=$(target/debug/fleet --version | awk '{print $2}')
          echo "FLEET_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p upgrade-stage/old/bin upgrade-stage/old/web \
            upgrade-stage/new/bin upgrade-stage/new/web
          for dir in old new; do
            cp target/debug/fleet target/debug/fleet-admin target/debug/fleet-daemon \
              "upgrade-stage/$dir/bin/"
            echo "$dir" > "upgrade-stage/$dir/web/index.html"
            tar -czf "upgrade-$dir.tar.gz" -C "upgrade-stage/$dir" .
          done
      - name: Upgrade smoke test
        run: |
          scripts/test/upgrade-smoke.sh \
            --old-archive upgrade-old.tar.gz \
            --new-archive upgrade-new.tar.gz \
            --new-version "v$FLEET_VERSION"
      - run: cargo test -p fleet-e2e-tests --test smoke --test setup --test lifecycle --test git_write -- --ignored
