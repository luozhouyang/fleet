[workspace]
resolver = "2"
members = [
    "apps/fleet-daemon",
    "apps/fleet-admin",
    "apps/fleet-cli",
    "crates/core-protocol",
    "crates/core-connection",
    "crates/daemon-runtime",
    "crates/daemon-workspace",
    "crates/daemon-git",
    "crates/admin-machine",
    "crates/admin-storage",
    "crates/daemon-storage",
    "crates/core-auth",
    "crates/admin-eventbus",
    "crates/daemon-process",
    "crates/core-config",
    "crates/core-common",
    "crates/e2e-tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
# internal
fleet-core-common = { path = "crates/core-common" }
fleet-core-protocol = { path = "crates/core-protocol" }
fleet-daemon-process = { path = "crates/daemon-process" }
fleet-core-config = { path = "crates/core-config" }
fleet-admin-storage = { path = "crates/admin-storage" }
fleet-daemon-storage = { path = "crates/daemon-storage" }
fleet-core-auth = { path = "crates/core-auth" }
fleet-admin-eventbus = { path = "crates/admin-eventbus" }
fleet-daemon-workspace = { path = "crates/daemon-workspace" }
fleet-daemon-git = { path = "crates/daemon-git" }
fleet-daemon-runtime = { path = "crates/daemon-runtime" }
fleet-core-connection = { path = "crates/core-connection" }
fleet-admin-machine = { path = "crates/admin-machine" }

# agent client protocol
agent-client-protocol = { version = "5.3", features = ["process"] }

# async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
base64 = "0.22"

# errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ids / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

# http / ws
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
http = "1"

# persistence
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros"] }

# security
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
sha2 = "0.10"
hex = "0.4"
subtle = "2"

# filesystem / git
ignore = "0.4"
notify = "6.1"
walkdir = "2"
globset = "0.4"

# misc
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
parking_lot = "0.12"
dashmap = "6"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
# Keep debug builds reasonably fast for a large monorepo.
opt-level = 0
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
