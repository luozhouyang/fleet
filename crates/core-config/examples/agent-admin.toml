# Example agent-admin configuration.
# Copy to ~/.agent-fleet/config.toml and adjust as needed.
# All keys are optional; omitted keys use the built-in defaults.

[server]
host = "127.0.0.1"
port = 8787
# public_url = "https://fleet.example.com"

[storage]
database = "~/.agent-fleet/agent-admin.db"

[auth]
admin_token = "dev-token"
pair_code_ttl_secs = 600
pair_code_max_attempts = 5

[machines]
heartbeat_interval_ms = 15000
heartbeat_timeout_ms = 45000
request_timeout_ms = 30000

[web]
# static_dir = "apps/web/dist"
