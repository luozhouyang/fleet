# Example daemon configuration.
# Copy to ~/.agent-fleet/config.toml and adjust as needed.
# All keys are optional; omitted keys use the built-in defaults.

[machine]
# id = "machine_..."
name = "My Laptop"
key_file = "~/.agent-fleet/machine.key"

[daemon]
host = "127.0.0.1"
port = 18080

[storage]
database = "~/.agent-fleet/agent.db"

[agent]
default_provider = "mock"
claude_bin = "claude"
codex_bin = "codex"
opencode_bin = "opencode"

[workspace]
# default_root = "~/Projects"
max_file_bytes = 2097152
default_ignores = [".git", "node_modules", "target", "dist", ".next", "__pycache__", ".venv"]

[connection]
# server_url = "ws://127.0.0.1:8787/ws/machine"
# pairing_code = "7Q2M-9XKR-4TWD"
heartbeat_interval_ms = 15000
reconnect_max_ms = 30000
